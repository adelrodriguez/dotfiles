mcp_configs:
  executor:
    name: executor
    transport: http
    registry: false
    url: https://mcp.executor.sh/mcp
  paper:
    name: paper
    transport: stdio
    args:
    - -c
    - p="$HOME/.paper/bin/paper"; [ -x "$p" ] || exit 0; exec "$p" mcp
    registry: false
    command: sh
mcp_target_servers:
  claude:
  - executor
  - paper
  codex:
  - executor
  - paper
  cursor:
  - executor
  - paper
  opencode:
  - executor
  - paper
